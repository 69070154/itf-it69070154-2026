<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOODPICKER ITF – Gacha Food</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&family=Sarabun:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left" id="studentId">69070154</div>
    <div class="nav-center">FOODPICKER ITF</div>
    <div class="nav-right" id="weekLabel">Week 15</div>
  </nav>

  <main class="gacha-app">
    <!-- Gacha Machine Card -->
    <div class="machine-card">
      <div class="card-stage">
        <div class="card-wrap" id="cardWrap">
          <!-- Front face: เผยผลรางวัล -->
          <div class="card face front" id="cardFront">
            <div class="card-glow"></div>
            <div class="card-backdrop"></div>
            <div class="card-content">
              <div class="rarity-badge" id="rarityBadge">R</div>
              <div class="card-image-wrap">
                <img id="gachaImage" class="gacha-image" src="thai-food-photography-feast-hero.webp" alt="อาหารแนะนำ" />
              </div>
              <h2 id="gachaName" class="gacha-name">กดสุ่มเพื่อเปิดการ์ด</h2>
              <p id="gachaDesc" class="gacha-desc">ของรางวัลจะปรากฏที่นี่หลังจากสุ่ม</p>
              <div id="gachaPrice" class="gacha-price">-</div>
            </div>
          </div>

          <!-- Back face: ขณะกำลังหมุนสุ่ม -->
          <div class="card face back" id="cardBack">
            <div class="card-back-content">
              <div class="gacha-spinner"></div>
              <div class="gacha-text">กำลังสุ่มเมนูอาหาร…</div>
            </div>
          </div>
        </div>
      </div>

      <button id="spinBtn" class="gacha-btn">สุ่มเมนูอาหาร (1 สุ่ม)</button>
    </div>

    <!-- Result Popup (ของรางวัลที่สุ่มได้) -->
    <div id="resultPopup" class="popup-overlay" aria-hidden="true">
      <div class="popup-container">
        <div class="popup-header">ผลการสุ่มกาชา</div>
        <div class="popup-card" id="popupCard">
          <div class="popup-rarity" id="popupRarity">R</div>
          <div class="popup-image-wrap">
            <img id="popupImage" class="popup-image" alt="อาหาร" />
          </div>
          <h2 id="popupName" class="popup-name">เมนูอาหาร</h2>
          <p id="popupDesc" class="popup-desc">คำอธิบายเมนูอาหาร</p>
          <div id="popupPrice" class="popup-price">-</div>
        </div>
        <button id="popupCloseBtn" class="popup-btn">สุ่มอีกครั้ง</button>
      </div>
    </div>

    <!-- Flash overlay (แสงวาบขณะสุ่ม) -->
    <div id="flashOverlay" class="flash-overlay"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
